    <meta name="description" content="Proactive 31-Day Habit Tracker — Plan Tonight. Execute Tomorrow across 8 Core Life Pillars." />

    <meta property="og:title" content="Proactive31 — Plan Tonight. Execute Tomorrow." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Proactive 31-Day Habit Tracker | Command Center</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('proactive31-theme');
          var theme = 'light';
          if (raw) {
            if (raw === 'dark' || raw === 'light') {
              theme = raw;
            } else {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.state && (parsed.state.theme === 'dark' || parsed.state.theme === 'light')) {
                theme = parsed.state.theme;
              }
            }
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (_e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-[var(--accent-primary)]/40 selection:text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
