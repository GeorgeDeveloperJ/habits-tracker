name: Setup Android & Tauri build environment
description: Installs Node.js, JDK 21, Rust (aarch64-linux-android), and Android SDK/NDK packages with dependency caching.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24'
  java-version:
    description: JDK version to install
    required: false
    default: '21'
  rust-version:
    description: Rust toolchain version to install
    required: false
    default: '1.100.0'
  android-platform:
    description: Android SDK platform package ID
    required: false
    default: 'android-37.0'
  android-build-tools:
    description: Android SDK build-tools version
    required: false
    default: '36.0.0'
  android-ndk:
    description: Android NDK version
    required: false
    default: '28.2.13676358'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Setup JDK
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: gradle

    - name: Cache Cargo and Rust target
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          frontend/src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ inputs.rust-version }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.rust-version }}-

    - name: Install Rust toolchain for Android ARM64
      shell: bash
      env:
        RUST_VERSION: ${{ inputs.rust-version }}
      run: |
        set -euo pipefail
        rustup toolchain install "${RUST_VERSION}" --profile minimal --target aarch64-linux-android
        rustup default "${RUST_VERSION}"

    - name: Install Android SDK platform, build-tools, and NDK
      shell: bash
      env:
        ANDROID_PLATFORM: ${{ inputs.android-platform }}
        ANDROID_BUILD_TOOLS: ${{ inputs.android-build-tools }}
        ANDROID_NDK: ${{ inputs.android-ndk }}
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        if [[ ! -d "$sdk_root" ]]; then
          echo "Android SDK directory not found at $sdk_root" >&2
          exit 1
        fi

        if command -v sdkmanager >/dev/null 2>&1; then
          SDKMANAGER="$(command -v sdkmanager)"
        elif [[ -x "$sdk_root/cmdline-tools/latest/bin/sdkmanager" ]]; then
          SDKMANAGER="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
        else
          echo "sdkmanager not found on PATH or under $sdk_root/cmdline-tools/latest/bin" >&2
          exit 1
        fi

        yes | "$SDKMANAGER" --licenses >/dev/null || true
        "$SDKMANAGER" \
          "platforms;${ANDROID_PLATFORM}" \
          "build-tools;${ANDROID_BUILD_TOOLS}" \
          "ndk;${ANDROID_NDK}"

        {
          echo "ANDROID_HOME=$sdk_root"
          echo "ANDROID_SDK_ROOT=$sdk_root"
          echo "NDK_HOME=$sdk_root/ndk/${ANDROID_NDK}"
        } >> "$GITHUB_ENV"
        echo "$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}" >> "$GITHUB_PATH"
